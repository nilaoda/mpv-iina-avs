name: Build macOS media stack

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish build outputs to GitHub Releases'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (leave empty to auto-generate)'
        required: false
        type: string

env:
  FFMPEG_VERSION: '9.0.1'
  LICENSE_FLAVOR: 'gpl'
  MPV_REF: 'v0.41.0'
  # Compatible snapshot before Intel/Sonoma bottle support ended in September 2026.
  X86_HOMEBREW_BREW_REF: 'a9838079e633de36cc8a8ecacf6e545adac73ee1'
  X86_HOMEBREW_CORE_REF: '252c29dbece147fa170e1755c0d68c18ffe3d651'
  BREW_PACKAGES: >-
    meson ninja pkg-config cmake nasm sdl2
    mujs luajit lua libass libarchive rubberband uchardet
    frei0r libvidstab
    jpeg-turbo little-cms2
    freetype fontconfig fribidi harfbuzz glib gnutls dav1d
    libbluray libbs2b libssh libxml2 webp rav1e svt-av1
    libplacebo shaderc molten-vk vulkan-loader
    jpeg-xl libsamplerate snappy speex libsoxr zeromq zimg

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned x86_64 Homebrew
        if: matrix.arch == 'x86_64'
        run: |
          # The current installer rejects Intel, including Rosetta. Bootstrap
          # the default Intel prefix directly from immutable Git snapshots.
          arch -x86_64 /usr/bin/true
          brew_dirs=(
            /usr/local/Homebrew /usr/local/Cellar /usr/local/Caskroom
            /usr/local/bin /usr/local/etc /usr/local/include /usr/local/lib
            /usr/local/opt /usr/local/sbin /usr/local/share
            /usr/local/var /usr/local/var/log /usr/local/var/homebrew
            /usr/local/var/homebrew/linked /usr/local/Frameworks
            /usr/local/etc/bash_completion.d /usr/local/lib/pkgconfig
            /usr/local/share/{aclocal,doc,info,locale,man,zsh}
            /usr/local/share/man/man{1,2,3,4,5,6,7,8}
            /usr/local/share/zsh/site-functions
          )
          sudo mkdir -p "${brew_dirs[@]}"
          sudo chown "$(id -un):$(id -gn)" "${brew_dirs[@]}"

          git init /usr/local/Homebrew
          git -C /usr/local/Homebrew remote add origin https://github.com/Homebrew/brew.git
          git -C /usr/local/Homebrew fetch --depth=1 origin "$X86_HOMEBREW_BREW_REF"
          git -C /usr/local/Homebrew checkout --detach FETCH_HEAD
          ln -sfn /usr/local/Homebrew/bin/brew /usr/local/bin/brew

          core=/usr/local/Homebrew/Library/Taps/homebrew/homebrew-core
          mkdir -p "$core"
          git init "$core"
          git -C "$core" remote add origin https://github.com/Homebrew/homebrew-core.git
          git -C "$core" fetch --depth=1 origin "$X86_HOMEBREW_CORE_REF"
          git -C "$core" checkout --detach FETCH_HEAD

          # Keep all later brew invocations on this snapshot, including builds.
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> "$GITHUB_ENV"
          echo "HOMEBREW_NO_INSTALL_FROM_API=1" >> "$GITHUB_ENV"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          arch -x86_64 /usr/local/bin/brew --prefix

      - name: Install build dependencies
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            for f in /usr/local/bin/*; do
              if [ -L "$f" ]; then
                target=$(readlink "$f")
                case "$target" in
                  */Python.framework/*) sudo rm -f "$f" ;;
                esac
              fi
            done
            # Do not update either repository or use current API formulae.
            arch -x86_64 /usr/local/bin/brew install --overwrite $BREW_PACKAGES
          else
            brew update
            brew install $BREW_PACKAGES
          fi

      - name: Build media stack
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
          AR: /usr/bin/ar
          RANLIB: /usr/bin/ranlib
          STRIP: /usr/bin/strip
          LIBTOOL: /usr/bin/libtool
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:$PATH"
          else
            export PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:$PATH"
          fi
          chmod +x tools/*.sh
          ./tools/build_all_macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iina-mpv-bundle-macos-${{ matrix.arch }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: macos-14
    if: ${{ inputs.publish_release }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: iina-mpv-bundle-macos-*
          path: release-files
          merge-multiple: true

      - name: Filter release files
        run: |
          # Remove txt manifests that would collide across arch builds.
          # They are already bundled inside the zip files.
          rm -f release-files/*.txt
          echo "Release files:"
          ls -la release-files/

      - name: Compute release metadata
        id: release_meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="mpv-iina-avs-ffmpeg-${FFMPEG_VERSION}-mpv-${MPV_REF}-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=macOS media stack $tag" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          generate_release_notes: true
          files: release-files/*.zip
